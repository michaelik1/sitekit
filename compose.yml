services:
  site:
    image: sitekit:latest
    restart: unless-stopped
    init: true
    ports:
      - '${SITE_PORT:-3000}:3000'
    environment:
      NUXT_CONTENT_CACHE_TTL_MS: ${NUXT_CONTENT_CACHE_TTL_MS:-1000}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-}
    volumes:
      - type: bind
        source: ${CONTENT_PATH:-./content}
        target: /app/content
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
