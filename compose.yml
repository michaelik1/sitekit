networks:
  reverse-proxy-network:
    external: true

x-decoy-image: &decoy-image decoy:latest

services:
  media-sync:
    build:
      context: .
      target: media-sync
    image: decoy-media-sync:latest
    profiles: ["tools"]
    env_file:
      - .env
    user: "0:0"
    restart: "no"
    volumes:
      - ./content:/app/content

  content-builder:
    build:
      context: .
    image: *decoy-image
    command: ["node", "scripts/prepare-content.mjs"]
    user: "0:0"
    restart: "no"
    volumes:
      - ./content:/app/content:ro
      - ./generated:/app/generated

  decoy:
    image: *decoy-image
    container_name: decoy
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://dacha-guide.online}
      NUXT_PUBLIC_CONTACT_EMAIL: ${NUXT_PUBLIC_CONTACT_EMAIL:-editor@dacha-guide.online}
    depends_on:
      content-builder:
        condition: service_completed_successfully
    expose:
      - "3000"
    volumes:
      - ./content:/app/content:ro
      - ./generated:/app/generated:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.status===204?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - reverse-proxy-network
